name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Build · Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wagering_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      localstack:
        image: nahuelnucera/ministack:latest
        env:
          SERVICES: sqs
          EAGER_SERVICE_LOADING: 1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Create .env for CI
        run: |
          cp .env.example .env
          {
            echo ""
            echo "# --- CI overrides ---"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_USER=postgres"
            echo "DB_PASSWORD=postgres"
            echo "DB_NAME=wagering_db"
            echo "DB_NAME_TEST=wagering_db_test"
            echo "QUEUE_BACKEND=memory"
            echo "OUTBOX_PUBLISHER_BACKEND=console"
            echo "WAGER_CONSUMER_ENABLED=false"
            echo "PENDING_REFERENCE_WORKER_ENABLED=false"
            echo "DEV_QUEUE_ENDPOINT=false"
          } >> .env

      - name: Wait for LocalStack
        run: |
          echo "Waiting for LocalStack (SQS)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "✅ LocalStack ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "⚠️ LocalStack not ready in 60s — SQS tests will be skipped (guard in spec)"

      - name: Apply migrations to dev DB
        run: bun run mikro-orm migration:up

      - name: Create test DB and apply migrations
        run: |
          bun run db:create-test
          DB_NAME=wagering_db_test bun run mikro-orm migration:up

      - name: Verify schema invariants
        run: bun run db:verify

      - name: Run full test suite (162 tests)
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            /tmp/wagering-test-results.log
            /tmp/bun-test-output.log
            /tmp/mig.log
            /tmp/verify.log
          if-no-files-found: ignore
          retention-days: 7
